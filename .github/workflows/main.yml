name: Create Android Signing Key

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias phoneagent \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "PhoneAgent2026!" \
            -keypass "PhoneAgent2026!" \
            -dname "CN=PhoneAgent,O=CasaWeb,C=ID"

      - name: Verify keystore
        run: |
          keytool -list \
            -v \
            -keystore release.keystore \
            -storepass "PhoneAgent2026!"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: phoneagent-signing-key
          path: release.keystore
